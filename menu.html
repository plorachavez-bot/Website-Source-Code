<!DOCTPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> Menu - Boba Byte</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #222;
    }
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: #3b2a20;
      color: white;
    }
      
    nav .logo {
      font-size: 1.3rem;
      font-weight: bold;
    }
      
    nav .a {
      color: white;
      text-decoration: none;
      margin-left: 24px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20 px 80px;
    }

    h1 {
      text-align: center;
    }

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

      .filters button {
        padding: 8px 16px;
        border: 1px solid #c17a3d;
        border-radius: 999px;
        background: white;
        color: #c17a3d;
        cursor: pointer;
        font-size: 0.9rem;
      }

      .filters button.active {
        background: #c17a3d
        color: white;
      }

      th, td {
        text-align: left;
        padding: 10px 12px
        border-bottom: 1px solid #ddd;
      }

      th {
        background: #f5ede1;
      }

      td:last-child, th:last-child {
        text-align: right;
      }
    
        
        
      
        
        
        
    </style>
      
  </head>
