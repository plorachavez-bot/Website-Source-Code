<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | Boba Byte</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="logo">🧋 Boba Byte</div>
        <div>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="build.html">Build Your Drink</a>
            <a href="order.html">Order</a>
        </div>
    </nav>

    <main>
        <!-- Order Summary -->
        <section class="order-section">
            <h1>Your Order</h1>

            <div id="orderList">
                <!-- Saved drinks added by script.js -->
            </div>

            <div class="order-totals">
                <p>
                    <span>Subtotal:</span>
                    <span>$<span id="subtotalAmount">0.00</span></span>
                </p>

                <p>
                    <span>Tax:</span>
                    <span>$<span id="taxAmount">0.00</span></span>
                </p>

                <p>
                    <span>Total:</span>
                    <span>$<span id="finalTotal">0.00</span></span>
                </p>
            </div>
        </section>

        <!-- Pickup Information -->
        <section class="pickup-section">
            <h2>Pickup Information</h2>

            <form id="pickupForm">

                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName"
                           name="firstName"
                           placeholder="Enter your first name"
                           required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName"
                           name="lastName"
                           placeholder="Enter your last name"
                           required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone"
                           name="phone"
                           placeholder="123-456-7890"
                           pattern="[0-9]{3}-?[0-9]{3}-?[0-9]{4}"
                           title="Enter a 10-digit phone number, like 123-456-7890"
                           required>
                    
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email"
                           name="email"
                           placeholder="example@email.com"
                           required>
                </div>

                <div class="form-group">
                    <label for="pickupTime">Pickup Time:</label>
                    <input type="datetime-local" id="pickupTime"
                           name="pickupTime"
                           required>
                </div>

                <div class="form-group">
                    <label for="confirmCheckbox">
                        <input type="checkbox"
                               id="confirmCheckbox"
                               required>
                        I confirm that my order and pickup
                        information are correct.
                    </label>
                </div>

                <button type="submit" id="placeOrderBtn">
                    Place Order
                </button>
            <p id="confirmMessage" role="status"></p>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2026 Boba Byte</p></footer>
    <script src="script.js"></script>
</body>
</html>
